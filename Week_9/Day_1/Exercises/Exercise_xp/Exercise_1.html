<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: JS Variables</title>
</head>
<body>

    <h1>Exercise 1: Exploring JavaScript Variables and Data Types</h1>
    <p>Right-click anywhere on this page, select <strong>Inspect</strong>, and go to the <strong>Console</strong> tab to see the output!</p>

    <script>
        let myString = "Hello, JavaScript!"; 
        let myNumber = 42;                  
        let myBoolean = true;               
        let myUndefined;                    
        let myNull = null;                  

        console.log("Value:", myString, "| Type:", typeof myString);
        console.log("Value:", myNumber, "| Type:", typeof myNumber);
        console.log("Value:", myBoolean, "| Type:", typeof myBoolean);
        console.log("Value:", myUndefined, "| Type:", typeof myUndefined);
        
        console.log("Value:", myNull, "| Type:", typeof myNull); 
    </script>

</body>
</html>
